<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>김동희 세계관 칼 뽑기 & 훈련장</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #0f1016;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100dvh;
            overflow: hidden;
            touch-action: none;
        }

        .container {
            width: 100%;
            max-width: 440px;
            height: 100dvh;
            background: linear-gradient(135deg, #151828 0%, #0b0d14 100%);
            display: flex;
            flex-direction: column;
            padding: 14px 16px 24px 16px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            position: relative;
        }

        .screen {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            justify-content: space-between;
        }

        .hidden {
            display: none !important;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .title-area h1 {
            font-size: 17px;
            background: linear-gradient(45deg, #ffcc00, #ff5555, #cc44ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
        }

        .btn-icon {
            background: #222639;
            border: 1px solid #3a4260;
            color: #fff;
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            background: rgba(26, 31, 51, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 8px;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .stat-item { text-align: center; }
        .stat-label { font-size: 10px; color: #8b9bb4; }
        .stat-value { font-size: 15px; font-weight: bold; color: #ffd700; margin-top: 2px; }

        /* 메인 뽑기 영역 (단차 및 10연차 2줄 5칸 통합) */
        .gacha-screen {
            flex-grow: 1;
            background: rgba(18, 22, 38, 0.9);
            border: 2px solid #2a3352;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            position: relative;
            margin-bottom: 12px;
            overflow: hidden;
        }

        /* 1회 뽑기 카드 스타일 */
        .single-view {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }

        .card-flip {
            perspective: 1000px;
            width: 135px;
            height: 135px;
            margin-bottom: 8px;
        }

        .card-flip-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .card-flip.flipped .card-flip-inner {
            transform: rotateY(180deg);
        }

        .card-face-back, .card-face-front {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #4a5580;
            box-shadow: 0 6px 16px rgba(0,0,0,0.5);
        }

        .card-face-back {
            background: linear-gradient(135deg, #2b324b, #171c2e);
            font-size: 36px;
            color: #ffd700;
        }

        .card-face-front {
            background: #222840;
            transform: rotateY(180deg);
            overflow: hidden;
        }

        .card-face-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 10연차 뽑기 2줄 5칸 그리드 (가로 5개 x 세로 2줄) */
        .multi-stage-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 6px;
            width: 100%;
        }

        .mini-card-flip {
            perspective: 800px;
            width: 100%;
            aspect-ratio: 1 / 1.25;
        }

        .mini-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
        }

        .mini-card-flip.flipped .mini-card-inner {
            transform: rotateY(180deg);
        }

        .mini-back, .mini-front {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 8px;
            border: 2px solid #4a5580;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .mini-back {
            background: linear-gradient(135deg, #2b324b, #171c2e);
            font-size: 18px;
        }

        .mini-front {
            background: #1a1f33;
            transform: rotateY(180deg);
            padding: 2px;
        }

        .mini-front img {
            width: 100%;
            height: 70%;
            object-fit: cover;
            border-radius: 4px;
        }

        .mini-name {
            font-size: 8px;
            font-weight: bold;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            text-align: center;
            margin-top: 2px;
        }

        .effect-general { border-color: #718096 !important; }
        .effect-rare { border-color: #3182ce !important; box-shadow: 0 0 10px rgba(49,130,206,0.6); }
        .effect-epic { border-color: #805ad5 !important; box-shadow: 0 0 10px rgba(128,90,213,0.6); }
        .effect-legendary { border-color: #ecc94b !important; box-shadow: 0 0 12px rgba(236,201,75,0.8); }
        .effect-myth { border-color: #e53e3e !important; box-shadow: 0 0 15px rgba(229,62,62,0.9); }

        .extra-badge-text { font-size: 12px; font-weight: bold; margin-bottom: 2px; min-height: 18px; text-align: center; }
        .weapon-name { font-size: 19px; font-weight: 900; text-align: center; min-height: 24px; }

        /* 하단 조작 버튼 (모바일 하단바 가림 방지) */
        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            padding-bottom: 6px;
        }

        .btn {
            width: 100%;
            padding: 13px 10px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-single { background: linear-gradient(135deg, #ff8008 0%, #ffc837 100%); color: #1a1a1a; }
        .btn-row { display: flex; gap: 8px; }
        .btn-multi { flex: 2; background: linear-gradient(135deg, #7928ca 0%, #b800ff 100%); color: #fff; }
        .btn-inventory { flex: 1.1; background: #2b324b; color: #fff; border: 1px solid #48537a; }

        /* 모달 스타일 */
        .modal {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(11, 13, 20, 0.96);
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #2a3352;
            padding-bottom: 10px;
            flex-shrink: 0;
        }

        .modal-header h2 { font-size: 16px; color: #ffd700; }
        .modal-close { background: none; border: none; color: #fff; font-size: 22px; cursor: pointer; }
        .modal-body { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }

        .rate-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .rate-table th, .rate-table td { padding: 10px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.08); }
        .rate-table th { color: #8b9bb4; background: rgba(255,255,255,0.03); }

        .inventory-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 10px;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .btn-sell-all {
            background: #e53e3e;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }

        .inventory-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .inv-item {
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
        }
        .inv-count { position: absolute; top: 6px; right: 8px; font-size: 10px; background: rgba(0,0,0,0.6); padding: 2px 5px; border-radius: 4px; color: #ffd700; }
        
        .grade-general { background: #4a5568; border: 1px solid #718096; }
        .grade-rare { background: #2b6cb0; border: 1px solid #3182ce; }
        .grade-epic { background: #6b46c1; border: 1px solid #805ad5; }
        .grade-legendary { background: #d69e2e; border: 1px solid #ecc94b; }
        .grade-myth { background: #9b2c2c; border: 1px solid #e53e3e; }

        .btn-action-row { display: flex; gap: 4px; margin-top: 6px; width: 100%; }
        .btn-equip, .btn-sell {
            flex: 1;
            padding: 5px 2px;
            font-size: 10px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-equip { background: #3182ce; color: #fff; }
        .btn-sell { background: #dd6b20; color: #fff; }
        .equipped-badge { font-size: 10px; color: #ffeb3b; font-weight: bold; margin-top: 4px; }

        /* 훈련장 화면 */
        #trainingScreen {
            background: #1a233a;
            position: relative;
            overflow: hidden;
            justify-content: center;
        }

        #gameCanvas {
            background: linear-gradient(135deg, #243b55, #141e30);
            display: block;
            margin: auto;
            border: 4px solid #4a5580;
            border-radius: 12px;
        }

        .training-ui-top {
            position: absolute;
            top: 15px; left: 15px; right: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 20;
            pointer-events: none;
        }
        .training-ui-top button { pointer-events: auto; }

        .joystick-zone {
            position: absolute;
            bottom: 30px; left: 25px;
            width: 130px; height: 130px;
            background: rgba(255,255,255,0.1);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            z-index: 20;
            touch-action: none;
        }

        .joystick-knob {
            position: absolute;
            top: 40px; left: 40px;
            width: 50px; height: 50px;
            background: rgba(255,255,255,0.75);
            border-radius: 50%;
            pointer-events: none;
        }

        .brawl-btns {
            position: absolute;
            bottom: 30px; right: 25px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 20;
            align-items: center;
        }

        .brawl-btn {
            width: 62px; height: 62px;
            border-radius: 50%;
            border: 3px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            touch-action: none;
        }

        .btn-attack { background: #ff3b30; width: 72px; height: 72px; font-size: 24px; }
        .btn-dash { background: #007aff; }

        /* 로비 전용 토스트 (훈련장에서는 안 뜸) */
        #toast {
            position: fixed;
            top: 18px; left: 50%;
            transform: translateX(-50%) translateY(-60px);
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.25s ease;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
        }
        #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body onclick="initAudioUser()">

<div class="container">
    <!-- 메인 로비 화면 -->
    <div id="mainScreen" class="screen">
        <div class="header">
            <button class="btn-icon" onclick="openModal('rateModal')">📊 확률표</button>
            <div class="title-area"><h1>김동희 세계관 칼 뽑기</h1></div>
            <button class="btn-icon" style="background: linear-gradient(135deg, #00b09b, #96c93d); color:#fff; border:none;" onclick="enterTraining()">🏟️ 훈련장</button>
        </div>

        <div class="stats-bar">
            <div class="stat-item"><div class="stat-label">총 뽑기 횟수</div><div class="stat-value" id="totalPulls">0회</div></div>
            <div class="stat-item"><div class="stat-label">보유 골드</div><div class="stat-value" id="goldCount">💰 10,000</div></div>
        </div>

        <div class="gacha-screen">
            <!-- 1회 뽑기 뷰 -->
            <div class="single-view" id="singleView">
                <div class="card-flip flipped" id="singleCardFlip">
                    <div class="card-flip-inner">
                        <div class="card-face-back">⚔️</div>
                        <div class="card-face-front effect-general" id="singleCardFront">
                            <img id="weaponImg" src="15157.jpg" alt="무기">
                        </div>
                    </div>
                </div>
                <div class="extra-badge-text" id="extraEffectText">👎👎👎</div>
                <div class="weapon-name" id="weaponName">나무 뭉둥이</div>
            </div>

            <!-- 10연차 뽑기 뷰 (2줄 5칸) -->
            <div class="multi-stage-grid hidden" id="multiStageGrid"></div>
        </div>

        <div class="action-buttons">
            <button class="btn btn-single" onclick="pullWeapon(1)" id="btnSingle">⚔️ 1회 뽑기 (100골드)</button>
            <div class="btn-row">
                <button class="btn btn-multi" onclick="pullWeapon(10)" id="btnMulti">✨ 10회 뽑기 (1,000골드)</button>
                <button class="btn btn-inventory" onclick="openModal('invModal')">🎒 보관함</button>
            </div>
        </div>
    </div>

    <!-- 훈련장 화면 -->
    <div id="trainingScreen" class="screen hidden">
        <div class="training-ui-top">
            <button class="btn-icon" onclick="exitTraining()">⬅️ 나가기</button>
            <div style="font-size: 13px; font-weight: bold; color: #ffd700;" id="equippedDisplay">장착 무기: 없음</div>
        </div>
        
        <canvas id="gameCanvas" width="380" height="380"></canvas>

        <!-- 브롤스타즈 멀티터치 조작계 -->
        <div class="joystick-zone" id="joystickZone">
            <div class="joystick-knob" id="joystickKnob"></div>
        </div>
        <div class="brawl-btns">
            <div class="brawl-btn btn-dash" id="dashBtn">💨</div>
            <div class="brawl-btn btn-attack" id="attackBtn">⚔️</div>
        </div>
    </div>
</div>

<!-- 확률표 모달 -->
<div class="modal" id="rateModal">
    <div class="modal-header">
        <h2>김동희 세계관 확률표</h2>
        <button class="modal-close" onclick="closeModal('rateModal')">&times;</button>
    </div>
    <div class="modal-body">
        <table class="rate-table">
            <thead><tr><th>칼 이름 : 확률</th><th style="text-align: right;">비율</th></tr></thead>
            <tbody>
                <tr><td>나무 뭉둥이 (일반 - 30골드)</td><td style="text-align: right; color:#a0aec0;">65.0%</td></tr>
                <tr><td>크로노스 인페르노 (희귀 - 70골드)</td><td style="text-align: right; color:#3182ce;">15.0%</td></tr>
                <tr><td>이클립스 (영웅 - 150골드)</td><td style="text-align: right; color:#805ad5;">10.0%</td></tr>
                <tr><td>불칼 (전설 - 300골드)</td><td style="text-align: right; color:#ecc94b;">7.5%</td></tr>
                <tr><td>일렉시아스 (신화 - 500골드)</td><td style="text-align: right; color:#e53e3e;">2.5%</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- 인벤토리 모달 -->
<div class="modal" id="invModal">
    <div class="modal-header">
        <h2>보유한 무기 보관함 (최대 1개 장착)</h2>
        <button class="modal-close" onclick="closeModal('invModal')">&times;</button>
    </div>
    <div class="modal-body">
        <div class="inventory-top-bar">
            <span style="font-size: 12px; color: #ffd700;">전체 칼 일괄 판매</span>
            <button class="btn-sell-all" onclick="sellAllWeapons()">모두 판매</button>
        </div>
        <div class="inventory-grid" id="inventoryGrid"></div>
    </div>
</div>

<div id="toast">알림</div>

<script>
    // 판매 가격 수정 반영 (일반 30, 희귀 70, 영웅 150, 전설 300, 신화 500)
    const weapons = [
        { id: 0, name: "나무 뭉둥이", rarity: "일반", sellPrice: 30, effectClass: "effect-general", extraText: "👎👎👎", img: "15157.jpg", rate: 65.0 },
        { id: 1, name: "크로노스 인페르노", rarity: "희귀", sellPrice: 70, effectClass: "effect-rare", extraText: "파란색 기운", img: "15158.jpg", rate: 15.0 },
        { id: 2, name: "이클립스", rarity: "영웅", sellPrice: 150, effectClass: "effect-epic", extraText: "보라색 오라", img: "15159.jpg", rate: 10.0 },
        { id: 3, name: "불칼", rarity: "전설", sellPrice: 300, effectClass: "effect-legendary", extraText: "⭐️⭐️⭐️⭐️", img: "15161.jpg", rate: 7.5 },
        { id: 4, name: "일렉시아스", rarity: "신화", sellPrice: 500, effectClass: "effect-myth", extraText: "🔥 불타는 신검 🔥", img: "15162.jpg", rate: 2.5 }
    ];

    let state = {
        totalPulls: 0,
        gold: 10000,
        inventory: { 0: 0, 1: 0, 2: 0, 3: 0, 4: 0 },
        equippedWeaponId: null
    };

    let inTraining = false;
    let isPulling = false;

    function loadGameData() {
        const saved = localStorage.getItem('donghee_gacha_save');
        if (saved) {
            try {
                const parsed = JSON.parse(saved);
                state.totalPulls = parsed.totalPulls || 0;
                state.gold = parsed.gold !== undefined ? parsed.gold : 10000;
                state.inventory = parsed.inventory || { 0: 0, 1: 0, 2: 0, 3: 0, 4: 0 };
                state.equippedWeaponId = parsed.equippedWeaponId !== undefined ? parsed.equippedWeaponId : null;
            } catch(e) {}
        }
    }

    function saveGameData() {
        localStorage.setItem('donghee_gacha_save', JSON.stringify(state));
    }

    let audioCtx = null;
    function initAudioUser() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(isHigh) {
        initAudioUser();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (isHigh) {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(880, now + 0.3);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
            osc.start(now); osc.stop(now + 0.5);
        } else {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, now);
            osc.frequency.exponentialRampToValueAtTime(400, now + 0.2);
            gain.gain.setValueAtTime(0.3, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
            osc.start(now); osc.stop(now + 0.25);
        }
    }

    function getRandomWeapon() {
        const rand = Math.random() * 100;
        let cumulative = 0;
        for (let w of weapons) {
            cumulative += w.rate;
            if (rand <= cumulative) return w;
        }
        return weapons[0];
    }

    // 1회 및 10회 뽑기 (카드 뒷면 표시 -> 1초 뒤 동시 뒤집기 개봉)
    function pullWeapon(count) {
        if (isPulling) return;
        initAudioUser();
        const cost = count === 10 ? 1000 : 100;
        if (state.gold < cost) {
            showToast("⚠️ 골드가 부족하다!");
            return;
        }

        isPulling = true;
        document.getElementById('btnSingle').disabled = true;
        document.getElementById('btnMulti').disabled = true;

        state.gold -= cost;
        state.totalPulls += count;

        const singleView = document.getElementById('singleView');
        const multiGrid = document.getElementById('multiStageGrid');

        if (count === 1) {
            multiGrid.classList.add('hidden');
            singleView.classList.remove('hidden');

            const w = getRandomWeapon();
            state.inventory[w.id]++;

            const cardFlip = document.getElementById('singleCardFlip');
            const cardFront = document.getElementById('singleCardFront');
            const extraText = document.getElementById('extraEffectText');
            const weaponName = document.getElementById('weaponName');

            // 뒷면 세팅
            cardFlip.classList.remove('flipped');
            extraText.innerText = "???";
            weaponName.innerText = "개봉 대기중...";

            document.getElementById('weaponImg').src = w.img;
            cardFront.className = `card-face-front ${w.effectClass}`;

            playSound(false);

            // 1초 뒤 카드 개봉
            setTimeout(() => {
                cardFlip.classList.add('flipped');
                extraText.innerText = w.extraText;
                weaponName.innerText = w.name;
                if (w.id >= 3) playSound(true);

                updateUI();
                saveGameData();
                updateInventoryGrid();

                isPulling = false;
                document.getElementById('btnSingle').disabled = false;
                document.getElementById('btnMulti').disabled = false;
            }, 1000);

        } else {
            // 10연차: 2줄 5칸 뒷면 먼저 표시 후 1초 뒤 동시 개봉
            singleView.classList.add('hidden');
            multiGrid.classList.remove('hidden');
            multiGrid.innerHTML = '';

            let results = [];
            let hasHigh = false;
            for (let i = 0; i < 10; i++) {
                const w = getRandomWeapon();
                state.inventory[w.id]++;
                results.push(w);
                if (w.id >= 3) hasHigh = true;

                const cardDiv = document.createElement('div');
                cardDiv.className = 'mini-card-flip';
                cardDiv.innerHTML = `
                    <div class="mini-card-inner">
                        <div class="mini-back">⚔️</div>
                        <div class="mini-front ${w.effectClass}">
                            <img src="${w.img}" alt="${w.name}">
                            <div class="mini-name">${w.name}</div>
                        </div>
                    </div>
                `;
                multiGrid.appendChild(cardDiv);
            }

            playSound(false);

            // 1초 뒤 10장 모두 동시에 뒤집기 개봉
            setTimeout(() => {
                const allCards = multiGrid.querySelectorAll('.mini-card-flip');
                allCards.forEach(c => c.classList.add('flipped'));
                if (hasHigh) playSound(true);

                updateUI();
                saveGameData();
                updateInventoryGrid();

                isPulling = false;
                document.getElementById('btnSingle').disabled = false;
                document.getElementById('btnMulti').disabled = false;
            }, 1000);
        }
    }

    function updateUI() {
        document.getElementById('totalPulls').innerText = state.totalPulls + "회";
        document.getElementById('goldCount').innerText = "💰 " + state.gold.toLocaleString();
    }

    function equipWeapon(id) {
        if (state.inventory[id] <= 0) {
            showToast("⚠️ 보유하지 않은 칼이다!");
            return;
        }
        state.equippedWeaponId = id;
        saveGameData();
        updateInventoryGrid();
        showToast(`✨ [${weapons[id].name}] 장착 완료!`);
    }

    function unequipWeapon() {
        state.equippedWeaponId = null;
        saveGameData();
        updateInventoryGrid();
        showToast("장착 해제 완료!");
    }

    function sellWeapon(id) {
        if (state.inventory[id] <= 0) {
            showToast("⚠️ 판매할 칼이 없다!");
            return;
        }
        state.inventory[id]--;
        if (state.equippedWeaponId === id && state.inventory[id] === 0) {
            state.equippedWeaponId = null;
        }
        state.gold += weapons[id].sellPrice;
        saveGameData();
        updateUI();
        updateInventoryGrid();
        showToast(`💰 [${weapons[id].name}] 판매 (+${weapons[id].sellPrice}골드)`);
    }

    function sellAllWeapons() {
        let totalGain = 0;
        weapons.forEach(w => {
            let count = state.inventory[w.id];
            if (count > 0) {
                totalGain += count * w.sellPrice;
                state.inventory[w.id] = 0;
            }
        });
        state.equippedWeaponId = null;
        state.gold += totalGain;
        saveGameData();
        updateUI();
        updateInventoryGrid();
        showToast(`💰 전체 판매 완료 (+${totalGain}골드)`);
    }

    function updateInventoryGrid() {
        const grid = document.getElementById('inventoryGrid');
        grid.innerHTML = '';

        weapons.forEach(w => {
            const count = state.inventory[w.id];
            const isEquipped = state.equippedWeaponId === w.id;
            const div = document.createElement('div');
            div.className = `inv-item ${w.rarity === '일반' ? 'grade-general' : w.rarity === '희귀' ? 'grade-rare' : w.rarity === '영웅' ? 'grade-epic' : w.rarity === '전설' ? 'grade-legendary' : 'grade-myth'}`;
            div.innerHTML = `
                <div class="inv-count">${count}개</div>
                <div style="width: 45px; height: 45px; border-radius: 8px; overflow: hidden; margin-bottom: 4px;">
                    <img src="${w.img}" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div style="font-size: 11px; font-weight: bold;">${w.name}</div>
                <div style="font-size: 9px; opacity: 0.9;">판매: ${w.sellPrice}골드</div>
                ${isEquipped ? '<div class="equipped-badge">장착중</div>' : ''}
                <div class="btn-action-row">
                    ${count > 0 ? (isEquipped ? `<button class="btn-equip" style="background:#e53e3e;" onclick="unequipWeapon()">해제</button>` : `<button class="btn-equip" onclick="equipWeapon(${w.id})">장착</button>`) : ''}
                    ${count > 0 ? `<button class="btn-sell" onclick="sellWeapon(${w.id})">판매</button>` : ''}
                </div>
            `;
            grid.appendChild(div);
        });
    }

    // 훈련장 진입 중에는 상단 초록색 토스트 알림이 절대 뜨지 않도록 차단
    function showToast(msg) {
        if (inTraining) return;
        const toast = document.getElementById('toast');
        toast.innerText = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1600);
    }

    function openModal(id) {
        document.getElementById(id).style.display = 'flex';
        if (id === 'invModal') updateInventoryGrid();
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // --- 훈련장 게임 로직 (조이스틱 & 대시 조작 완전 수리) ---
    let canvas, ctx;
    let worldWidth = 800, worldHeight = 380;
    let camera = { x: 0, y: 0, width: 380, height: 380 };
    let player = { x: 400, y: 190, radius: 18, speed: 4, angle: 0 };
    let robots = [];
    let projectiles = [];
    let effects = [];
    let joystick = { active: false, dx: 0, dy: 0 };
    
    let dashAiming = false;
    let dashAimAngle = 0;

    let gameInterval = null;
    let controlsInitialized = false;
    let playerImg = new Image();
    playerImg.src = '15194.png';

    function enterTraining() {
        inTraining = true;
        document.getElementById('toast').classList.remove('show');
        document.getElementById('mainScreen').classList.add('hidden');
        document.getElementById('trainingScreen').classList.remove('hidden');

        const eqName = state.equippedWeaponId !== null ? weapons[state.equippedWeaponId].name : "맨손";
        document.getElementById('equippedDisplay').innerText = "장착 무기: " + eqName;

        canvas = document.getElementById('gameCanvas');
        ctx = canvas.getContext('2d');

        robots = [];
        for (let i = 0; i < 4; i++) robots.push({ x: 150 + i * 150, y: 90, radius: 16 });
        for (let i = 0; i < 4; i++) robots.push({ x: 150 + i * 150, y: 290, radius: 16 });

        player.x = 400; player.y = 190;
        joystick = { active: false, dx: 0, dy: 0 };
        dashAiming = false;
        projectiles = [];
        effects = [];

        if (!controlsInitialized) {
            setupControls();
            controlsInitialized = true;
        }

        if (gameInterval) clearInterval(gameInterval);
        gameInterval = setInterval(updateGame, 1000 / 60);
    }

    function exitTraining() {
        inTraining = false;
        if (gameInterval) clearInterval(gameInterval);
        document.getElementById('trainingScreen').classList.add('hidden');
        document.getElementById('mainScreen').classList.remove('hidden');
    }

    // 멀티터치 & 마우스 완벽 호환 컨트롤러 (조이스틱 + 대시 + 공격)
    function setupControls() {
        const zone = document.getElementById('joystickZone');
        const knob = document.getElementById('joystickKnob');
        const dashBtn = document.getElementById('dashBtn');
        const attackBtn = document.getElementById('attackBtn');

        let moveTouchId = null;
        let dashTouchId = null;

        function updateJoystickPos(clientX, clientY) {
            const rect = zone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let x = clientX - centerX;
            let y = clientY - centerY;
            const dist = Math.sqrt(x * x + y * y);
            const maxDist = 45;

            if (dist > maxDist) {
                x = (x / dist) * maxDist;
                y = (y / dist) * maxDist;
            }

            knob.style.transform = `translate(${x}px, ${y}px)`;
            joystick.dx = x / maxDist;
            joystick.dy = y / maxDist;

            if (dist > 4) {
                player.angle = Math.atan2(joystick.dy, joystick.dx);
            }
        }

        function updateDashAimPos(clientX, clientY) {
            const rect = dashBtn.getBoundingClientRect();
            const bx = rect.left + rect.width / 2;
            const by = rect.top + rect.height / 2;
            const dx = clientX - bx;
            const dy = clientY - by;
            if (Math.sqrt(dx * dx + dy * dy) > 5) {
                dashAimAngle = Math.atan2(dy, dx);
            } else {
                dashAimAngle = player.angle;
            }
        }

        // 이동 조이스틱 터치
        zone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (moveTouchId === null && e.changedTouches.length > 0) {
                const t = e.changedTouches[0];
                moveTouchId = t.identifier;
                joystick.active = true;
                updateJoystickPos(t.clientX, t.clientY);
            }
        }, { passive: false });

        // 대시 버튼 터치 (조준 후 떼면 발동)
        dashBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (dashTouchId === null && e.changedTouches.length > 0) {
                const t = e.changedTouches[0];
                dashTouchId = t.identifier;
                dashAiming = true;
                dashAimAngle = player.angle;
                updateDashAimPos(t.clientX, t.clientY);
            }
        }, { passive: false });

        // 공격 버튼 터치
        attackBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            playerAttack();
        }, { passive: false });

        // 전체 화면 터치 이동 추적
        window.addEventListener('touchmove', (e) => {
            if (!inTraining) return;
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === moveTouchId) {
                    updateJoystickPos(t.clientX, t.clientY);
                } else if (t.identifier === dashTouchId) {
                    updateDashAimPos(t.clientX, t.clientY);
                }
            }
        }, { passive: false });

        // 터치 종료 처리
        function handleTouchEnd(e) {
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (t.identifier === moveTouchId) {
                    moveTouchId = null;
                    joystick.active = false;
                    joystick.dx = 0;
                    joystick.dy = 0;
                    knob.style.transform = `translate(0px, 0px)`;
                } else if (t.identifier === dashTouchId) {
                    dashTouchId = null;
                    dashAiming = false;
                    executeDash();
                }
            }
        }

        window.addEventListener('touchend', handleTouchEnd);
        window.addEventListener('touchcancel', handleTouchEnd);

        // PC 마우스 테스트 지원
        let mouseMoveActive = false;
        let mouseDashActive = false;

        zone.addEventListener('mousedown', (e) => {
            mouseMoveActive = true;
            joystick.active = true;
            updateJoystickPos(e.clientX, e.clientY);
        });

        dashBtn.addEventListener('mousedown', (e) => {
            mouseDashActive = true;
            dashAiming = true;
            dashAimAngle = player.angle;
            updateDashAimPos(e.clientX, e.clientY);
        });

        attackBtn.addEventListener('mousedown', () => {
            playerAttack();
        });

        window.addEventListener('mousemove', (e) => {
            if (mouseMoveActive) updateJoystickPos(e.clientX, e.clientY);
            if (mouseDashActive) updateDashAimPos(e.clientX, e.clientY);
        });

        window.addEventListener('mouseup', () => {
            if (mouseMoveActive) {
                mouseMoveActive = false;
                joystick.active = false;
                joystick.dx = 0;
                joystick.dy = 0;
                knob.style.transform = `translate(0px, 0px)`;
            }
            if (mouseDashActive) {
                mouseDashActive = false;
                dashAiming = false;
                executeDash();
            }
        });
    }

    function executeDash() {
        player.x += Math.cos(dashAimAngle) * 95;
        player.y += Math.sin(dashAimAngle) * 95;
        player.angle = dashAimAngle;
        // 대시 잔상 이펙트
        effects.push({ type: 'dash', x: player.x, y: player.y, timer: 15 });
    }

    function updateGame() {
        player.x += joystick.dx * player.speed;
        player.y += joystick.dy * player.speed;

        player.x = Math.max(player.radius + 15, Math.min(worldWidth - player.radius - 15, player.x));
        player.y = Math.max(player.radius + 15, Math.min(worldHeight - player.radius - 15, player.y));

        camera.x = player.x - camera.width / 2;
        camera.x = Math.max(0, Math.min(worldWidth - camera.width, camera.x));

        projectiles.forEach((p, index) => {
            p.x += p.vx; p.y += p.vy;
            p.life--;
            if (p.life <= 0) projectiles.splice(index, 1);
        });

        effects.forEach((eff, index) => {
            eff.timer--;
            if (eff.timer <= 0) effects.splice(index, 1);
        });

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        // 하늘 위 맵 테두리
        ctx.strokeStyle = '#68d391';
        ctx.lineWidth = 5;
        ctx.strokeRect(10, 10, worldWidth - 20, worldHeight - 20);

        // 로봇들 렌더링
        robots.forEach(r => {
            ctx.beginPath();
            ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#ff4d4d';
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = '#fff';
            ctx.stroke();
            ctx.closePath();

            ctx.fillStyle = '#000';
            ctx.fillRect(r.x - 18, r.y - 25, 36, 5);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(r.x - 18, r.y - 25, 36, 5);
        });

        // 특수 효과 렌더링
        effects.forEach(eff => {
            ctx.save();
            if (eff.type === 'fire') {
                ctx.fillStyle = 'rgba(255, 69, 0, 0.5)';
                ctx.beginPath();
                ctx.arc(eff.x, eff.y, eff.radius, 0, Math.PI * 2);
                ctx.fill();
            } else if (eff.type === 'smoke') {
                ctx.fillStyle = 'rgba(20, 20, 20, 0.8)';
                ctx.beginPath();
                ctx.arc(eff.x, eff.y - (60 - eff.timer) * 0.8, 28, 0, Math.PI * 2);
                ctx.fill();
            } else if (eff.type === 'dash') {
                ctx.fillStyle = 'rgba(0, 122, 255, 0.4)';
                ctx.beginPath();
                ctx.arc(eff.x, eff.y, 22, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();
        });

        // 투사체 렌더링
        projectiles.forEach(p => {
            ctx.beginPath();
            ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.fill();
            ctx.closePath();
        });

        // 내 캐릭터 렌더링
        ctx.save();
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(playerImg, player.x - player.radius, player.y - player.radius, player.radius * 2, player.radius * 2);
        ctx.restore();

        ctx.lineWidth = 2;
        ctx.strokeStyle = '#00ffcc';
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.stroke();

        // 장착 무기 표시
        if (state.equippedWeaponId !== null) {
            let hx = player.x + Math.cos(player.angle) * 22;
            let hy = player.y + Math.sin(player.angle) * 22;
            ctx.beginPath();
            ctx.arc(hx, hy, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#ffd700';
            ctx.fill();
        }

        // 브롤스타즈 대시 조준선 미리보기
        if (dashAiming) {
            ctx.strokeStyle = '#00aaff';
            ctx.lineWidth = 4;
            ctx.setLineDash([6, 6]);
            ctx.beginPath();
            ctx.moveTo(player.x, player.y);
            ctx.lineTo(player.x + Math.cos(dashAimAngle) * 95, player.y + Math.sin(dashAimAngle) * 95);
            ctx.stroke();
            ctx.setLineDash([]);
        }

        ctx.restore();
    }

    function playerAttack() {
        if (state.equippedWeaponId === null) {
            projectiles.push({ x: player.x + Math.cos(player.angle)*20, y: player.y + Math.sin(player.angle)*20, vx: Math.cos(player.angle)*3, vy: Math.sin(player.angle)*3, color: '#ffffff', life: 8 });
            return;
        }

        const weaponId = state.equippedWeaponId;
        const angle = player.angle;

        if (weaponId === 0) {
            // 나무 뭉둥이 던지기
            projectiles.push({ x: player.x, y: player.y, vx: Math.cos(angle) * 6, vy: Math.sin(angle) * 6, color: '#d69e2e', life: 40 });
        } else if (weaponId === 1) {
            // 크로노스 인페르노 근접 참격
            projectiles.push({ x: player.x + Math.cos(angle) * 25, y: player.y + Math.sin(angle) * 25, vx: Math.cos(angle) * 2, vy: Math.sin(angle) * 2, color: '#3182ce', life: 10 });
        } else if (weaponId === 2) {
            // 이클립스 앞으로 2칸 대시 공격
            player.x += Math.cos(angle) * 60;
            player.y += Math.sin(angle) * 60;
            effects.push({ type: 'dash', x: player.x, y: player.y, timer: 15 });
        } else if (weaponId === 3) {
            // 불칼 주변 불바다 (2.5초)
            effects.push({ type: 'fire', x: player.x, y: player.y, radius: 55, timer: 150 });
        } else if (weaponId === 4) {
            // 일렉시아스 아래에서 위로 어두운 검은색 연기 + 원거리 공격
            effects.push({ type: 'smoke', x: player.x + Math.cos(angle) * 40, y: player.y + Math.sin(angle) * 40, timer: 60 });
            projectiles.push({ x: player.x, y: player.y, vx: Math.cos(angle) * 7.5, vy: Math.sin(angle) * 7.5, color: '#1a202c', life: 45 });
        }
    }

    loadGameData();
    updateUI();
    updateInventoryGrid();
</script>

</body>
