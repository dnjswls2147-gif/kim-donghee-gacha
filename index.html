<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김동희 세계관 칼 뽑기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            background: radial-gradient(circle at center, #1e1b4b 0%, #09090b 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .title-font {
            font-family: 'Black Han Sans', sans-serif;
        }
        .glow-common { text-shadow: 0 0 10px rgba(156, 163, 175, 0.7); }
        .glow-rare { text-shadow: 0 0 15px rgba(59, 130, 246, 0.9); }
        .glow-epic { text-shadow: 0 0 20px rgba(168, 85, 247, 0.9); }
        .glow-legendary { text-shadow: 0 0 25px rgba(234, 179, 8, 0.9); }
        .glow-mythic { text-shadow: 0 0 30px rgba(239, 68, 68, 1); animation: pulse-red 1.5s infinite; }

        @keyframes pulse-red {
            0%, 100% { text-shadow: 0 0 20px rgba(239, 68, 68, 0.8), 0 0 40px rgba(239, 68, 68, 0.5); }
            50% { text-shadow: 0 0 35px rgba(239, 68, 68, 1), 0 0 60px rgba(239, 68, 68, 0.8); }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(-2deg); }
            40% { transform: translate(3px, 2px) rotate(2deg); }
            60% { transform: translate(-1px, -1px) rotate(0deg); }
            80% { transform: translate(2px, 1px) rotate(1deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out infinite;
        }

        @keyframes popUp {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            70% { transform: scale(1.1) rotate(3deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .animate-pop {
            animation: popUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            pointer-events: none;
            animation: floatUp 8s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }
    </style>
</head>
<body class="flex flex-col min-h-screen relative select-none">

    <!-- Background Floating Particles -->
    <div id="particles" class="absolute inset-0 overflow-hidden z-0"></div>

    <!-- Main Container -->
    <div class="relative z-10 flex flex-col items-center justify-between min-h-screen p-4 max-w-xl mx-auto w-full">
        
        <!-- Header -->
        <header class="w-full text-center py-2 flex flex-col items-center">
            <div class="flex items-center justify-between w-full mb-1">
                <span class="text-xs text-yellow-300 bg-yellow-900/40 px-2.5 py-1 rounded-full border border-yellow-700/50">김동희 세계관 공식</span>
                <button onclick="toggleAudio()" id="audio-toggle-btn" class="text-xs bg-slate-800 text-gray-300 px-3 py-1 rounded-full border border-slate-700 hover:bg-slate-700 transition">🔊 효과음 켜짐</button>
            </div>
            <h1 class="title-font text-2xl sm:text-3xl text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-pink-500 to-purple-500 tracking-wider drop-shadow-lg">
                ⚔️ 김동희 세계관 칼 뽑기 ⚔️
            </h1>
            <p class="text-xs sm:text-sm text-gray-300 mt-1">전설의 명기를 획득하고 최강의 검객이 되어보세요!</p>
        </header>

        <!-- Stats Bar -->
        <div class="w-full bg-slate-900/90 border border-slate-700/80 rounded-2xl p-3 flex justify-around items-center backdrop-blur-md shadow-xl text-xs sm:text-sm my-2">
            <div class="text-center">
                <span class="text-gray-400 block text-[11px]">총 뽑기 횟수</span>
                <span id="total-pulls" class="text-lg font-bold text-yellow-400">0회</span>
            </div>
            <div class="h-6 w-px bg-slate-700"></div>
            <div class="text-center">
                <span class="text-gray-400 block text-[11px]">보유 골드</span>
                <span id="user-gold" class="text-lg font-bold text-amber-400">🪙 10,000</span>
            </div>
        </div>

        <!-- Center Gacha Display Area -->
        <main class="w-full flex-1 flex flex-col items-center justify-center my-2">
            <div id="gacha-box" class="w-full aspect-square max-w-[300px] bg-gradient-to-b from-slate-800/95 to-slate-900/95 border-4 border-slate-700 rounded-3xl p-4 flex flex-col items-center justify-center relative shadow-2xl backdrop-blur-md transition-all duration-300">
                
                <!-- Idle State -->
                <div id="idle-display" class="flex flex-col items-center text-center">
                    <div class="w-24 h-24 bg-slate-700/50 rounded-2xl border-2 border-dashed border-slate-500 flex items-center justify-center mb-3 shadow-inner">
                        <svg class="w-12 h-12 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.5 17.5L3 6V3h3l11.5 11.5"></path><path d="M13 19l6-6"></path></svg>
                    </div>
                    <h2 class="text-base font-bold text-gray-200">버튼을 눌러 칼을 뽑아보세요!</h2>
                    <p class="text-[11px] text-gray-400 mt-1">1~5번 무기 중 하나를 획득하세요.</p>
                </div>

                <!-- Result State -->
                <div id="result-display" class="hidden flex-col items-center text-center w-full h-full justify-center">
                    <div id="card-frame" class="relative w-36 h-36 sm:w-40 sm:h-40 rounded-2xl flex items-center justify-center p-1.5 shadow-2xl border-2 mb-2 bg-slate-950 animate-pop overflow-hidden">
                        <img id="weapon-img" src="" alt="검 이미지" class="w-full h-full object-cover rounded-xl shadow-md">
                    </div>
                    <span id="weapon-rarity-badge" class="px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase tracking-wider mb-0.5 shadow-md">등급</span>
                    <h3 id="weapon-name" class="text-lg sm:text-xl font-black mt-0.5">검 이름</h3>
                    <p id="weapon-desc" class="text-[11px] text-gray-300 mt-0.5 px-2 line-clamp-1">설명</p>
                </div>

            </div>
        </main>

        <!-- Controls Section -->
        <div class="w-full flex flex-col gap-2.5 my-2">
            <button id="pull-btn" onclick="executeGacha(1)" class="w-full py-3.5 rounded-2xl title-font text-lg sm:text-xl bg-gradient-to-r from-yellow-500 via-orange-500 to-red-500 text-white shadow-lg shadow-orange-500/40 hover:scale-[1.01] active:scale-[0.99] transition-all border-2 border-yellow-300/50 flex items-center justify-center gap-2 cursor-pointer">
                <span>⚔️ 단차 뽑기 (1회: 100골드)</span>
            </button>
            <div class="flex gap-2">
                <button onclick="executeGacha(10)" class="flex-1 py-2.5 rounded-xl font-bold bg-gradient-to-r from-purple-600 to-indigo-600 text-white shadow-md hover:opacity-95 active:scale-95 transition-all text-xs sm:text-sm border border-purple-400/30">
                    ✨ 10연차 뽑기 (900골드)
                </button>
                <button onclick="resetData()" class="px-4 py-2.5 rounded-xl font-bold bg-slate-800 text-gray-400 hover:text-white hover:bg-slate-700 transition-all text-xs border border-slate-700">
                    🔄 초기화
                </button>
            </div>
        </div>

        <!-- Probability Table Accordion -->
        <div class="w-full bg-slate-900/90 border border-slate-800 rounded-2xl p-3 shadow-xl my-2">
            <div class="flex justify-between items-center cursor-pointer" onclick="toggleProbTable()">
                <h4 class="font-bold text-xs sm:text-sm text-yellow-400 flex items-center gap-2">
                    📊 김동희 세계관 확률표 및 검 목록 보기
                </h4>
                <span id="toggle-icon" class="text-xs text-gray-400 transition-transform duration-300">▼</span>
            </div>
            
            <div id="prob-table-container" class="hidden mt-2.5 overflow-x-auto transition-all">
                <table class="w-full text-left text-xs border-collapse">
                    <thead>
                        <tr class="border-b border-slate-700 text-gray-400">
                            <th class="py-1.5 px-2">사진</th>
                            <th class="py-1.5 px-2">등급 / 이름</th>
                            <th class="py-1.5 px-2 text-right">확률</th>
                        </tr>
                    </thead>
                    <tbody id="prob-tbody" class="divide-y divide-slate-800/80">
                        <!-- Populated via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Footer -->
        <footer class="text-center text-[10px] text-slate-500 py-1">
            김동희 세계관 공식 가챠 게임 &bull; All Rights Reserved
        </footer>

    </div>

    <!-- Toast Popup -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 bg-slate-800/95 border border-yellow-500 text-white px-5 py-2.5 rounded-2xl shadow-2xl z-50 transition-all duration-300 opacity-0 pointer-events-none transform -translate-y-10 flex items-center gap-2.5">
        <span id="toast-icon" class="text-lg">⚠️</span>
        <span id="toast-msg" class="text-xs font-bold">알림 메시지</span>
    </div>

    <!-- Script Engine -->
    <script>
        // -------------------------------------------------------------
        // Weapon Data Definitions (Exact match to 5 user photos in order)
        // -------------------------------------------------------------
        const weapons = [
            {
                id: 1,
                name: "나무 뭉둥이",
                rarity: "일반",
                chance: 65.0,
                color: "text-gray-400",
                badgeBg: "bg-gray-700 text-gray-200",
                borderCol: "border-gray-500",
                glowClass: "glow-common",
                desc: "첫 번째 사진: 길가에 나뒹굴던 나무 뭉둥이와 올빼미 시계.",
                image: "15157.jpg"
            },
            {
                id: 2,
                name: "크로노스 인페르노",
                rarity: "희귀",
                chance: 15.0,
                color: "text-blue-400",
                badgeBg: "bg-blue-900/80 text-blue-300",
                borderCol: "border-blue-500",
                glowClass: "glow-rare",
                desc: "두 번째 사진: 전 서버에 단 2개뿐인 분홍빛 명검.",
                image: "15158.jpg"
            },
            {
                id: 3,
                name: "이클립스",
                rarity: "영웅",
                chance: 10.0,
                color: "text-purple-400",
                badgeBg: "bg-purple-900/80 text-purple-300",
                borderCol: "border-purple-500",
                glowClass: "glow-epic",
                desc: "세 번째 사진: 붉은 문양이 새겨진 적월선 검.",
                image: "15159.jpg"
            },
            {
                id: 4,
                name: "불칼",
                rarity: "전설",
                chance: 7.5,
                color: "text-amber-400",
                badgeBg: "bg-amber-900/80 text-amber-300",
                borderCol: "border-amber-500",
                glowClass: "glow-legendary",
                desc: "네 번째 사진: 빨간 불칼 글자 모양의 독특한 무기.",
                image: "15161.jpg"
            },
            {
                id: 5,
                name: "일렉시아스",
                rarity: "신화",
                chance: 2.5,
                color: "text-red-500",
                badgeBg: "bg-red-900/80 text-red-300",
                borderCol: "border-red-500",
                glowClass: "glow-mythic",
                desc: "다섯 번째 사진: 죽음의 데스 사이드 낫과 후드 복장.",
                image: "15162.jpg"
            }
        ];

        let totalPulls = 0;
        let userGold = 10000;
        let isPulling = false;
        let audioEnabled = true;

        // -------------------------------------------------------------
        // Web Audio API Sound System
        // -------------------------------------------------------------
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function toggleAudio() {
            audioEnabled = !audioEnabled;
            const btn = document.getElementById('audio-toggle-btn');
            btn.innerText = audioEnabled ? "🔊 효과음 켜짐" : "🔇 효과음 꺼짐";
            showToast(audioEnabled ? "효과음이 켜졌습니다." : "효과음이 꺼졌습니다.", "🎵");
        }

        function playTickSound() {
            if (!audioEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250 + Math.random() * 150, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.06);
            } catch (e) {
                console.error(e);
            }
        }

        function playResultSound(rarityIndex) {
            if (!audioEnabled) return;
            try {
                initAudio();
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                if (rarityIndex <= 1) {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(100, now + 0.25);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(now + 0.25);
                } else if (rarityIndex === 2 || rarityIndex === 3) {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.setValueAtTime(600, now + 0.1);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(now + 0.4);
                } else {
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                        const chordOsc = audioCtx.createOscillator();
                        const chordGain = audioCtx.createGain();
                        chordOsc.type = 'sawtooth';
                        chordOsc.frequency.setValueAtTime(freq, now + (idx * 0.06));
                        chordGain.gain.setValueAtTime(0.08, now + (idx * 0.06));
                        chordGain.gain.exponentialRampToValueAtTime(0.001, now + 0.7 + (idx * 0.06));
                        chordOsc.connect(chordGain);
                        chordGain.connect(audioCtx.destination);
                        chordOsc.start(now + (idx * 0.06));
                        chordOsc.stop(now + 0.8 + (idx * 0.06));
                    });
                }
            } catch (e) {
                console.error(e);
            }
        }

        // -------------------------------------------------------------
        // UI Population
        // -------------------------------------------------------------
        function populateProbTable() {
            const tbody = document.getElementById('prob-tbody');
            tbody.innerHTML = '';
            weapons.forEach(w => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-800/50 transition-colors";
                tr.innerHTML = `
                    <td class="py-1.5 px-2">
                        <img src="${w.image}" class="w-8 h-8 rounded-lg object-cover border border-slate-700" onerror="this.src='https://placehold.co/50x50/1e293b/f8fafc?text=Img'">
                    </td>
                    <td class="py-1.5 px-2">
                        <span class="font-bold ${w.color}">${w.rarity}</span> <span class="text-gray-200">${w.name}</span>
                    </td>
                    <td class="py-1.5 px-2 text-right font-mono text-gray-300">${w.chance}%</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function toggleProbTable() {
            const container = document.getElementById('prob-table-container');
            const icon = document.getElementById('toggle-icon');
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                container.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }

        function showToast(message, icon = "✨") {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            const toastIcon = document.getElementById('toast-icon');
            
            toastMsg.innerText = message;
            toastIcon.innerText = icon;
            
            toast.classList.remove('opacity-0', 'pointer-events-none', '-translate-y-10');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'pointer-events-none', '-translate-y-10');
            }, 2200);
        }

        // -------------------------------------------------------------
        // Gacha Logic
        // -------------------------------------------------------------
        function getRandomWeapon() {
            const rand = Math.random() * 100;
            let cumulative = 0;
            for (let i = 0; i < weapons.length; i++) {
                cumulative += weapons[i].chance;
                if (rand <= cumulative) {
                    return weapons[i];
                }
            }
            return weapons[0];
        }

        function executeGacha(count) {
            if (isPulling) return;
            const cost = count === 10 ? 900 : 100;
            if (userGold < cost) {
                showToast(`골드가 부족합니다! (필요 골드: ${cost})`, "🪙");
                return;
            }

            userGold -= cost;
            totalPulls += count;
            updateStats();

            isPulling = true;
            const pullBtn = document.getElementById('pull-btn');
            pullBtn.disabled = true;

            const gachaBox = document.getElementById('gacha-box');
            const idleDisplay = document.getElementById('idle-display');
            const resultDisplay = document.getElementById('result-display');

            idleDisplay.classList.add('hidden');
            resultDisplay.classList.add('hidden');
            gachaBox.classList.add('animate-shake', 'border-yellow-500');

            let tickCount = 0;
            const maxTicks = 10;
            const tickInterval = setInterval(() => {
                playTickSound();
                tickCount++;
                if (tickCount >= maxTicks) {
                    clearInterval(tickInterval);
                    finishPull(count);
                }
            }, 50);
        }

        function finishPull(count) {
            const gachaBox = document.getElementById('gacha-box');
            const resultDisplay = document.getElementById('result-display');
            const pullBtn = document.getElementById('pull-btn');

            gachaBox.classList.remove('animate-shake', 'border-yellow-500');

            let selectedWeapon;
            if (count === 10) {
                let rolls = [];
                for (let i = 0; i < 10; i++) rolls.push(getRandomWeapon());
                rolls.sort((a, b) => b.id - a.id);
                selectedWeapon = rolls[0];
            } else {
                selectedWeapon = getRandomWeapon();
            }

            const imgEl = document.getElementById('weapon-img');
            const badgeEl = document.getElementById('weapon-rarity-badge');
            const nameEl = document.getElementById('weapon-name');
            const descEl = document.getElementById('weapon-desc');
            const cardFrame = document.getElementById('card-frame');

            imgEl.src = selectedWeapon.image;
            badgeEl.innerText = count === 10 ? `${selectedWeapon.rarity} (10연차 최고)` : selectedWeapon.rarity;
            badgeEl.className = `px-2.5 py-0.5 rounded-full text-[11px] font-bold uppercase tracking-wider mb-0.5 shadow-md ${selectedWeapon.badgeBg}`;
            nameEl.innerText = selectedWeapon.name;
            nameEl.className = `text-lg sm:text-xl font-black mt-0.5 ${selectedWeapon.color} ${selectedWeapon.glowClass}`;
            descEl.innerText = selectedWeapon.desc;
            cardFrame.className = `relative w-36 h-36 sm:w-40 sm:h-40 rounded-2xl flex items-center justify-center p-1.5 shadow-2xl border-2 mb-2 bg-slate-950 animate-pop overflow-hidden ${selectedWeapon.borderCol}`;

            resultDisplay.classList.remove('hidden');
            resultDisplay.classList.add('flex');

            playResultSound(selectedWeapon.id - 1);

            if (selectedWeapon.id >= 4) {
                showToast(`🎉 대단합니다! [${selectedWeapon.name}] 획득!`, "⚡");
            }

            isPulling = false;
            pullBtn.disabled = false;
        }

        function updateStats() {
            document.getElementById('total-pulls').innerText = `${totalPulls}회`;
            document.getElementById('user-gold').innerText = `🪙 ${userGold.toLocaleString()}`;
        }

        function resetData() {
            totalPulls = 0;
            userGold = 10000;
            updateStats();
            document.getElementById('result-display').classList.add('hidden');
            document.getElementById('idle-display').classList.remove('hidden');
            showToast("데이터가 초기화되었습니다.", "🔄");
        }

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 12; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 5 + 2;
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.animationDuration = `${Math.random() * 6 + 4}s`;
                particle.style.animationDelay = `${Math.random() * 4}s`;
                container.appendChild(particle);
            }
        }

        window.onload = function() {
            populateProbTable();
            createParticles();
            updateStats();
        };
    </script>
</body>
</html>
